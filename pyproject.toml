[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gvm"
version = "0.2.0"
description = "Control GVM BD45R LED tube lights over DMX512: CLI and local MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "ftd2xx>=1.3", "mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gvm = "gvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
